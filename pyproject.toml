[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts_webui_extension.pyvideotrans_api"
version = "0.0.1"
description = "Custom TTS HTTP API (form-urlencoded) with integration to TTS Generation WebUI adapters."
readme = "README.md"
authors = [
    { name = "rsxdalv" },
]
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
]
urls = { "Homepage" = "https://github.com/rsxdalv/tts_webui_extension.pyvideotrans_api" }

[tool.setuptools.packages.find]
namespace = true
